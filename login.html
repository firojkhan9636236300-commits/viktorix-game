<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIKTORIX Login</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#03152f;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    width:90%;
    max-width:420px;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    margin:0;
    font-size:42px;
    color:#00bfff;
    letter-spacing:3px;
    text-shadow:0 0 15px #00bfff;
}

.logo p{
    margin:8px 0 0;
    color:#9ccfff;
    font-size:14px;
}

.login-box{
    background:#051f46;
    border:1px solid #0b5c91;
    border-radius:18px;
    padding:28px 22px;
    box-shadow:0 0 25px rgba(0,191,255,.18);
}

.login-box h2{
    text-align:center;
    margin:0 0 25px;
    font-size:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    color:#b9dcff;
}

.input-group input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #17669b;
    outline:none;
    background:#02152e;
    color:white;
    font-size:16px;
}

.input-group input:focus{
    border-color:#00bfff;
    box-shadow:0 0 8px rgba(0,191,255,.35);
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#00bfff;
    color:#00152b;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.login-btn:hover{
    background:#27caff;
}

.message{
    display:none;
    margin-top:18px;
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-size:14px;
}

.error{
    background:#4a1010;
    border:1px solid #ff4444;
    color:#ffb0b0;
}

.success{
    background:#0d421f;
    border:1px solid #22cc66;
    color:#aaffc5;
}

.loading{
    text-align:center;
    display:none;
    margin-top:15px;
    color:#9ccfff;
    font-size:14px;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#7698b8;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>VIKTORIX</h1>
        <p>Gaming Platform</p>
    </div>

    <div class="login-box">

        <h2>Login</h2>

        <div class="input-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
            >
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
            >
        </div>

        <button
            type="button"
            class="login-btn"
            id="loginBtn"
        >
            LOGIN
        </button>

        <div class="loading" id="loading">
            Checking account...
        </div>

        <div class="message error" id="errorMessage"></div>

        <div class="message success" id="successMessage"></div>

    </div>

    <div class="footer">
        © 2026 VIKTORIX. All Rights Reserved.
    </div>

</div>

<script type="module">

import {
    signInWithEmailAndPassword,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
    auth,
    db
} from "./firebase.js";


const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const loginBtn = document.getElementById("loginBtn");

const loading = document.getElementById("loading");
const errorMessage = document.getElementById("errorMessage");
const successMessage = document.getElementById("successMessage");


function showError(message){

    errorMessage.textContent = message;
    errorMessage.style.display = "block";

    successMessage.style.display = "none";
}


function showSuccess(message){

    successMessage.textContent = message;
    successMessage.style.display = "block";

    errorMessage.style.display = "none";
}


function setLoading(state){

    loading.style.display = state ? "block" : "none";

    loginBtn.disabled = state;

    loginBtn.textContent = state ? "PLEASE WAIT..." : "LOGIN";
}


loginBtn.addEventListener("click", async () => {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    errorMessage.style.display = "none";
    successMessage.style.display = "none";


    if(!email){

        showError("Please enter your email.");
        return;
    }


    if(!password){

        showError("Please enter your password.");
        return;
    }


    setLoading(true);


    try{

        const userCredential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user = userCredential.user;

console.log("LOGIN UID:", user.uid);
console.log("LOGIN EMAIL:", user.email);

showSuccess("Login UID: " + user.uid);


/*
 * Firestore Users document
 * Document ID = Firebase Authentication UID
 */

const userRef =
    doc(db, "Users", user.uid);

        const userSnap =
            await getDoc(userRef);


        if(!userSnap.exists()){

            await auth.signOut();

            showError(
                "User account data not found in Firestore."
            );

            setLoading(false);
            return;
        }


        const userData =
            userSnap.data();


        /*
         * Admin account
         */

        if(userData.role === "admin"){

            showSuccess("Admin login successful.");

            setTimeout(() => {

                window.location.href =
                    "admin.html";

            }, 800);

            return;
        }


        /*
         * Normal user must be approved
         */

        if(userData.approved !== true){

            await auth.signOut();

            showError(
                "Your account is not approved by admin yet."
            );

            setLoading(false);
            return;
        }


        /*
         * Approved user
         */

        showSuccess("Login successful.");

        setTimeout(() => {

            window.location.href =
                "index.html";

        }, 800);


    }catch(error){

        console.error("LOGIN ERROR:", error);


        let message =
            "Login failed. Please try again.";


        if(error.code === "auth/invalid-credential"){

            message =
                "Invalid email or password.";
        }

        else if(error.code === "auth/user-not-found"){

            message =
                "No account found with this email.";
        }

        else if(error.code === "auth/wrong-password"){

            message =
                "Incorrect password.";
        }

        else if(error.code === "auth/invalid-email"){

            message =
                "Please enter a valid email.";
        }

        else if(error.code === "auth/too-many-requests"){

            message =
                "Too many attempts. Please try again later.";
        }

        else if(error.code === "permission-denied"){

            message =
                "Firestore permission denied.";
        }


        showError(message);

        setLoading(false);
    }

});

</script>
