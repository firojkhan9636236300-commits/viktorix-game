<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIKTORIX Login</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: #03152f;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 60px;
    color: #00bfff;
}

.login-box {
    width: 90%;
    max-width: 350px;
    margin: 40px auto;
    padding: 25px;
    background: #051f46;
    border-radius: 15px;
    box-sizing: border-box;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    box-sizing: border-box;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: #00bfff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
}

a {
    color: #00bfff;
    text-decoration: none;
}

#message {
    margin-top: 15px;
    min-height: 20px;
}
</style>
</head>

<body>

<h1>🎮 VIKTORIX</h1>

<div class="login-box">

<h2>Login</h2>

<input
    id="username"
    type="text"
    placeholder="Username"
>

<input
    id="password"
    type="password"
    placeholder="Password"
>

<button id="loginBtn">Login</button>

<p id="message"></p>

<p>
New player?
<a href="register.html">Register</a>
</p>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");


loginBtn.addEventListener("click", login);


async function login() {

    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!username || !password) {
        message.textContent =
            "Username aur password dono bharo.";
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";
    message.textContent = "";

    try {

        const usersRef = collection(db, "Users");

        const q = query(
            usersRef,
            where("username", "==", username)
        );

        const snapshot = await getDocs(q);

        if (snapshot.empty) {
            message.textContent = "Username nahi mila.";

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
            return;
        }

        const userDoc = snapshot.docs[0];
        const userData = userDoc.data();

        const email = userData.email;

        if (!email) {
            message.textContent =
                "Account me email missing hai.";

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
            return;
        }

        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        const loggedInUid = credential.user.uid;

        if (loggedInUid !== userDoc.id) {

            await auth.signOut();

            message.textContent =
                "Account verification failed.";

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
            return;
        }

        if (userData.approved !== true) {

            await auth.signOut();

            message.textContent =
                "Aapka account abhi Admin ne approve nahi kiya.";

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
            return;
        }

        message.textContent =
            "Login successful!";

        window.location.href =
            "dashboard.html";

    } catch (error) {

        console.error(error);

        if (
            error.code === "auth/wrong-password" ||
            error.code === "auth/invalid-credential"
        ) {
            message.textContent =
                "Password galat hai.";
        }
        else if (
            error.code === "auth/user-not-found"
        ) {
            message.textContent =
                "Account nahi mila.";
        }
        else {
            message.textContent =
                "Login failed. Firebase settings check karo.";
        }

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
    }
}

</script>

</body>
</html>
