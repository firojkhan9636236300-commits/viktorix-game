<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIKTORIX Login</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#03152f;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    width:90%;
    max-width:400px;
    margin:80px auto;
    padding:30px 20px;
    background:#051f46;
    border-radius:15px;
    box-shadow:0 0 25px rgba(0,191,255,.20);
}

h1{
    text-align:center;
    color:#00bfff;
    margin:0 0 30px;
    font-size:32px;
}

label{
    display:block;
    margin:12px 0 6px;
    color:#cfefff;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:8px;
    border:0;
    outline:0;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:8px;
    background:#00bfff;
    color:white;
    font-size:17px;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
}

#message{
    margin-top:20px;
    padding:10px;
    min-height:24px;
    text-align:center;
    word-break:break-word;
    line-height:1.5;
}

.info{
    text-align:center;
    margin-top:15px;
    color:#9ec7dd;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>VIKTORIX</h1>

<label>Email</label>
<input
    type="email"
    id="username"
    placeholder="Enter your email"
    autocomplete="email"
>

<label>Password</label>
<input
    type="password"
    id="password"
    placeholder="Enter your password"
    autocomplete="current-password"
>

<button id="loginBtn">Login</button>

<div id="message"></div>

<div class="info">
VIKTORIX Secure Login
</div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");
const emailInput = document.getElementById("username");
const passwordInput = document.getElementById("password");

loginBtn.addEventListener("click", login);

async function login(){

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if(!email || !password){
        message.style.color="#ffcc00";
        message.textContent="Email aur password dono bharo.";
        return;
    }

    loginBtn.disabled=true;
    loginBtn.textContent="Logging in...";
    message.style.color="white";
    message.textContent="Login ho raha hai...";

    try{

        /* AUTH */

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        const uid=result.user.uid;

        console.log("AUTH UID:",uid);

        message.textContent=
            "Auth successful. Users collection check ho rahi hai...";


        /* USERS COLLECTION TEST */

        const usersRef=collection(db,"Users");

        const snapshot=await getDocs(usersRef);

        console.log(
            "USERS COUNT:",
            snapshot.size
        );


        let ids=[];

        snapshot.forEach((item)=>{

            console.log(
                "DOCUMENT:",
                item.id,
                item.data()
            );

            ids.push(item.id);

        });


        /* RESULT */

        if(snapshot.empty){

            await signOut(auth);

            message.style.color="#ff5252";

            message.innerHTML=
                "<b>USERS COLLECTION EMPTY</b><br><br>"+
                "Website ko Users ka koi document nahi mila.<br><br>"+
                "Auth UID:<br>"+
                uid;

        }else{

            message.style.color="#00ff88";

            message.innerHTML=
                "<b>USERS COLLECTION FOUND</b><br><br>"+
                "Documents: "+
                snapshot.size+
                "<br><br>"+
                "IDs:<br>"+
                ids.join("<br>");

            await signOut(auth);

        }

        loginBtn.disabled=false;
        loginBtn.textContent="Login";

    }catch(error){

        console.error("TEST ERROR:",error);

        message.style.color="#ff5252";

        message.innerHTML=
            "<b>FIRESTORE TEST ERROR</b><br><br>"+
            "Code: "+
            (error.code || "unknown")+
            "<br><br>"+
            "Message:<br>"+
            (error.message || "Unknown error");

        loginBtn.disabled=false;
        loginBtn.textContent="Login";
    }

}

</script>

</body>
</html>
