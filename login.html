<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIKTORIX Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #03152f;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 90%;
    max-width: 400px;
    margin: 80px auto;
    padding: 30px 20px;
    background: #051f46;
    border-radius: 15px;
    box-shadow: 0 0 25px rgba(0,191,255,0.20);
}

h1 {
    text-align: center;
    color: #00bfff;
    margin: 0 0 30px 0;
    font-size: 32px;
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 6px;
    color: #cfefff;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 8px;
    border: none;
    outline: none;
    border-radius: 8px;
    font-size: 16px;
    background: white;
    color: #111;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #00bfff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#message {
    margin-top: 20px;
    padding: 10px;
    min-height: 24px;
    text-align: center;
    word-break: break-word;
    line-height: 1.5;
}

.info {
    text-align: center;
    margin-top: 15px;
    color: #9ec7dd;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <h1>VIKTORIX</h1>

    <label for="username">Email</label>

    <input
        type="email"
        id="username"
        placeholder="Enter your email"
        autocomplete="email"
    >

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
    >

    <button id="loginBtn" type="button">
        Login
    </button>

    <div id="message"></div>

    <div class="info">
        VIKTORIX Secure Login
    </div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");


loginBtn.addEventListener("click", login);


async function login() {

    const email = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {

        message.style.color = "#ffcc00";
        message.textContent =
            "Email aur password dono bharo.";

        return;
    }


    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    message.style.color = "white";
    message.textContent = "Firebase login ho raha hai...";


    try {

        /* =========================================
           AUTH LOGIN
        ========================================= */

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        const user = result.user;
        const uid = user.uid;


        console.log("AUTH SUCCESS");
        console.log("UID:", uid);


        message.textContent =
            "Authentication successful...";


        /* =========================================
           FIRESTORE DOCUMENT
        ========================================= */

        const userRef =
            doc(
                db,
                "Users",
                uid
            );


        console.log("Firestore path:", userRef.path);


        let userSnapshot;

        try {

            userSnapshot =
                await getDoc(userRef);

        } catch (firestoreError) {

            console.error(
                "FIRESTORE ERROR:",
                firestoreError
            );

            message.style.color = "#ff5252";

            message.innerHTML =
                "<b>FIRESTORE ERROR</b><br><br>" +
                "Code: " +
                firestoreError.code +
                "<br><br>" +
                "Message: " +
                firestoreError.message;

            await signOut(auth);

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";

            return;
        }


        /* =========================================
           DOCUMENT RESULT
        ========================================= */

        console.log(
            "DOCUMENT EXISTS:",
            userSnapshot.exists()
        );


        if (!userSnapshot.exists()) {

            console.error(
                "DOCUMENT NOT FOUND:",
                userRef.path
            );

            await signOut(auth);

            message.style.color = "#ff5252";

            message.innerHTML =
                "<b>FIRESTORE DOCUMENT NOT FOUND</b><br><br>" +
                "Project: viktorix-game<br>" +
                "Database: (default)<br>" +
                "Collection: Users<br>" +
                "UID: " + uid;

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";

            return;
        }


        /* =========================================
           DOCUMENT FOUND
        ========================================= */

        const data =
            userSnapshot.data();


        console.log(
            "FIRESTORE DATA:",
            data
        );


        console.log(
            "ROLE:",
            data.role
        );

        console.log(
            "APPROVED:",
            data.approved
        );

        console.log(
            "POINTS:",
            data.points
        );


        /* =========================================
           ADMIN
        ========================================= */

        if (
            data.role === "admin" &&
            data.approved === true
        ) {

            message.style.color = "#00ff88";

            message.textContent =
                "Admin login successful!";


            setTimeout(() => {

                window.location.href =
                    "admin.html";

            }, 700);

            return;
        }


        /* =========================================
           NORMAL USER
        ========================================= */

        if (
            data.role === "user" &&
            data.approved === true
        ) {

            message.style.color = "#00ff88";

            message.textContent =
                "Login successful!";


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 700);

            return;
        }


        /* =========================================
           NOT APPROVED / INVALID ROLE
        ========================================= */

        await signOut(auth);

        message.style.color = "#ffcc00";

        message.textContent =
            "Account approved nahi hai.";

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";


    } catch (error) {

        console.error(
            "VIKTORIX LOGIN ERROR:",
            error
        );


        message.style.color = "#ff5252";

        message.innerHTML =
            "<b>LOGIN ERROR</b><br><br>" +
            "Code: " +
            (error.code || "unknown") +
            "<br><br>" +
            "Message: " +
            (error.message || "Unknown error");


        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
    }

}

</script>

</body>
</html>
