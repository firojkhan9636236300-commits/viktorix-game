<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIKTORIX Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #03152f;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 90%;
    max-width: 400px;
    margin: 80px auto;
    padding: 30px 20px;
    background: #051f46;
    border-radius: 15px;
    box-shadow: 0 0 25px rgba(0,191,255,0.20);
}

h1 {
    text-align: center;
    color: #00bfff;
    margin: 0 0 30px 0;
    font-size: 32px;
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 6px;
    color: #cfefff;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 8px;
    border: none;
    outline: none;
    border-radius: 8px;
    font-size: 16px;
    background: white;
    color: #111;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #00bfff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#message {
    margin-top: 20px;
    padding: 10px;
    min-height: 24px;
    text-align: center;
    word-break: break-word;
    line-height: 1.5;
}

.info {
    text-align: center;
    margin-top: 15px;
    color: #9ec7dd;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <h1>VIKTORIX</h1>

    <label for="username">Email</label>
    <input
        type="email"
        id="username"
        placeholder="Enter your email"
        autocomplete="email"
    >

    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
    >

    <button id="loginBtn" type="button">
        Login
    </button>

    <div id="message"></div>

    <div class="info">
        VIKTORIX Secure Login
    </div>

</div>

<script type="module">

const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");


// --------------------------------------------------
// Firebase load
// --------------------------------------------------

let auth;
let db;

try {

    message.textContent = "Firebase loading...";

    const firebaseModule = await import("./firebase.js");

    auth = firebaseModule.auth;
    db = firebaseModule.db;

    if (!auth || !db) {
        throw new Error(
            "firebase.js se auth ya db load nahi hua."
        );
    }

    message.textContent = "";

    console.log("Firebase successfully loaded.");

} catch (error) {

    console.error("Firebase Load Error:", error);

    message.textContent =
        "Firebase load nahi hua: " + error.message;

    message.style.color = "#ff5252";

    loginBtn.disabled = true;
}


// --------------------------------------------------
// Firebase modules
// --------------------------------------------------

let signInWithEmailAndPassword;
let signOut;
let doc;
let getDoc;

try {

    if (auth && db) {

        const authModule = await import(
            "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js"
        );

        const firestoreModule = await import(
            "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js"
        );

        signInWithEmailAndPassword =
            authModule.signInWithEmailAndPassword;

        signOut =
            authModule.signOut;

        doc =
            firestoreModule.doc;

        getDoc =
            firestoreModule.getDoc;

        console.log("Firebase Auth and Firestore loaded.");

    }

} catch (error) {

    console.error("Firebase SDK Error:", error);

    message.textContent =
        "Firebase SDK error: " + error.message;

    message.style.color = "#ff5252";

    loginBtn.disabled = true;
}


// --------------------------------------------------
// Login
// --------------------------------------------------

loginBtn.addEventListener("click", login);


async function login() {

    const email = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {

        message.style.color = "#ffcc00";

        message.textContent =
            "Email aur password dono bharo.";

        return;
    }

    if (!auth || !db) {

        message.style.color = "#ff5252";

        message.textContent =
            "Firebase connect nahi hai.";

        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    message.style.color = "white";
    message.textContent = "Please wait...";

    try {

        // ------------------------------------------
        // Firebase Authentication
        // ------------------------------------------

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        const user = result.user;
        const uid = user.uid;

        console.log("Firebase Auth UID:", uid);

        message.textContent =
            "Login successful. User data check ho raha hai...";


        // ------------------------------------------
        // Firestore Users document
        // ------------------------------------------

        const userRef =
            doc(db, "Users", uid);

        const userDoc =
            await getDoc(userRef);

        console.log(
            "Firestore document exists:",
            userDoc.exists()
        );


        // ------------------------------------------
        // User document nahi mila
        // ------------------------------------------

        if (!userDoc.exists()) {

            await signOut(auth);

            message.style.color = "#ff5252";

            message.textContent =
                "User data nahi mila. UID: " + uid;

            console.error(
                "Firestore document not found:",
                uid
            );

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";

            return;
        }


        // ------------------------------------------
        // User data
        // ------------------------------------------

        const data = userDoc.data();

        console.log(
            "Firestore User Data:",
            data
        );


        // ------------------------------------------
        // ADMIN
        // ------------------------------------------

        if (
            data.role === "admin" &&
            data.approved === true
        ) {

            message.style.color = "#00ff88";

            message.textContent =
                "Admin login successful!";

            setTimeout(function() {

                window.location.href =
                    "admin.html";

            }, 500);

            return;
        }


        // ------------------------------------------
        // APPROVED USER
        // ------------------------------------------

        if (
            data.role === "user" &&
            data.approved === true
        ) {

            message.style.color = "#00ff88";

            message.textContent =
                "Login successful!";

            setTimeout(function() {

                window.location.href =
                    "index.html";

            }, 500);

            return;
        }


        // ------------------------------------------
        // NOT APPROVED
        // ------------------------------------------

        await signOut(auth);

        message.style.color = "#ffcc00";

        message.textContent =
            "Aapka account abhi Admin ne approve nahi kiya.";

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";


    } catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );

        message.style.color = "#ff5252";


        if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password"
        ) {

            message.textContent =
                "Email ya password galat hai.";

        }

        else if (
            error.code === "auth/user-not-found"
        ) {

            message.textContent =
                "Account nahi mila.";

        }

        else if (
            error.code === "auth/invalid-email"
        ) {

            message.textContent =
                "Email format galat hai.";

        }

        else if (
            error.code === "auth/too-many-requests"
        ) {

            message.textContent =
                "Bahut zyada login attempts. Thodi der baad try karo.";

        }

        else if (
            error.code === "permission-denied"
        ) {

            message.textContent =
                "Firestore permission denied. Firebase Rules check karo.";

        }

        else {

            message.textContent =
                "Error: " + error.message;
        }

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
    }
}

</script>

</body>
</html>
