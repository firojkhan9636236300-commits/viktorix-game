<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIKTORIX Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #03152f;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 90%;
    max-width: 400px;
    margin: 80px auto;
    padding: 30px 20px;
    background: #051f46;
    border-radius: 15px;
    box-shadow: 0 0 25px rgba(0,191,255,0.20);
}

h1 {
    text-align: center;
    color: #00bfff;
    margin: 0 0 30px 0;
    font-size: 32px;
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 6px;
    color: #cfefff;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 8px;
    border: none;
    outline: none;
    border-radius: 8px;
    font-size: 16px;
    background: white;
    color: #111;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #00bfff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#message {
    margin-top: 20px;
    padding: 10px;
    min-height: 24px;
    text-align: center;
    word-break: break-word;
    line-height: 1.5;
}

.info {
    text-align: center;
    margin-top: 15px;
    color: #9ec7dd;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <h1>VIKTORIX</h1>

    <label for="username">Email</label>

    <input
        type="email"
        id="username"
        placeholder="Enter your email"
        autocomplete="email"
    >

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
    >

    <button id="loginBtn" type="button">
        Login
    </button>

    <div id="message"></div>

    <div class="info">
        VIKTORIX Secure Login
    </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import { auth, db } from "./firebase.js";

import {
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =====================================================
   HTML ELEMENTS
===================================================== */

const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");


/* =====================================================
   CHECK FIREBASE
===================================================== */

console.log("VIKTORIX Login started");
console.log("Auth:", auth);
console.log("Firestore:", db);

if (!auth || !db) {

    message.style.color = "#ff5252";

    message.textContent =
        "Firebase connect nahi hua.";

    loginBtn.disabled = true;
}


/* =====================================================
   LOGIN BUTTON
===================================================== */

loginBtn.addEventListener("click", login);


/* =====================================================
   LOGIN FUNCTION
===================================================== */

async function login() {

    const email = usernameInput.value.trim();
    const password = passwordInput.value;


    /* -----------------------------------------------
       EMPTY CHECK
    ----------------------------------------------- */

    if (!email || !password) {

        message.style.color = "#ffcc00";

        message.textContent =
            "Email aur password dono bharo.";

        return;
    }


    /* -----------------------------------------------
       BUTTON LOCK
    ----------------------------------------------- */

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    message.style.color = "white";
    message.textContent = "Please wait...";


    try {

        /* ============================================
           STEP 1
           FIREBASE AUTH LOGIN
        ============================================ */

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user = result.user;

        const uid = user.uid;


        console.log(
            "AUTH LOGIN SUCCESS"
        );

        console.log(
            "Firebase UID:",
            uid
        );


        message.textContent =
            "Login successful. User data check ho raha hai...";


        /* ============================================
           STEP 2
           FIRESTORE USERS DOCUMENT
        ============================================ */

        const userRef =
            doc(
                db,
                "Users",
                uid
            );


        console.log(
            "Firestore path:",
            "Users/" + uid
        );


        const userSnapshot =
            await getDoc(userRef);
console.log("UID USED:", uid);
console.log("DOCUMENT PATH:", userRef.path);
console.log("DOCUMENT DATA:", userSnapshot.exists() ? userSnapshot.data() : "NO DATA");

        console.log(
            "Firestore document exists:",
            userSnapshot.exists()
        );


        /* ============================================
           STEP 3
           DOCUMENT NOT FOUND
        ============================================ */

        if (!userSnapshot.exists()) {

            await signOut(auth);

            message.style.color = "#ff5252";

            message.textContent =
                "User data nahi mila. UID: " + uid;

            console.error(
                "DOCUMENT NOT FOUND",
                "Users/" + uid
            );

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";

            return;
        }


        /* ============================================
           STEP 4
           GET USER DATA
        ============================================ */

        const data =
            userSnapshot.data();


        console.log(
            "FIRESTORE USER DATA:",
            data
        );


        console.log(
            "Role:",
            data.role
        );

        console.log(
            "Approved:",
            data.approved
        );

        console.log(
            "Points:",
            data.points
        );


        /* ============================================
           STEP 5
           ADMIN LOGIN
        ============================================ */

        if (
            data.role === "admin" &&
            data.approved === true
        ) {

            message.style.color = "#00ff88";

            message.textContent =
                "Admin login successful!";

            console.log(
                "ADMIN LOGIN SUCCESS"
            );


            setTimeout(() => {

                window.location.href =
                    "admin.html";

            }, 700);


            return;
        }


        /* ============================================
           STEP 6
           NORMAL USER LOGIN
        ============================================ */

        if (
            data.role === "user" &&
            data.approved === true
        ) {

            message.style.color = "#00ff88";

            message.textContent =
                "Login successful!";

            console.log(
                "USER LOGIN SUCCESS"
            );


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 700);


            return;
        }


        /* ============================================
           STEP 7
           NOT APPROVED
        ============================================ */

        await signOut(auth);

        message.style.color = "#ffcc00";

        message.textContent =
            "Aapka account abhi Admin ne approve nahi kiya.";

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";


    } catch (error) {

        console.error(
            "VIKTORIX LOGIN ERROR:",
            error
        );


        message.style.color = "#ff5252";


        /* --------------------------------------------
           AUTH ERRORS
        -------------------------------------------- */

        if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password"
        ) {

            message.textContent =
                "Email ya password galat hai.";

        }

        else if (
            error.code === "auth/user-not-found"
        ) {

            message.textContent =
                "Account nahi mila.";

        }

        else if (
            error.code === "auth/invalid-email"
        ) {

            message.textContent =
                "Email format galat hai.";

        }

        else if (
            error.code === "auth/too-many-requests"
        ) {

            message.textContent =
                "Bahut zyada login attempts. Thodi der baad try karo.";

        }

        else if (
            error.code === "permission-denied" ||
            error.code === "firestore/permission-denied"
        ) {

            message.textContent =
                "Firestore permission denied. Firebase Rules check karo.";

        }

        else {

            message.textContent =
                "Error: " + error.message;
        }


        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
    }
}

</script>

</body>
</html>
