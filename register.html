<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIKTORIX Register</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px;
}

input {
  width: 90%;
  max-width: 350px;
  padding: 12px;
  margin: 8px 0;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  width: 90%;
  max-width: 350px;
  padding: 12px;
  margin: 8px 0;
  font-size: 16px;
  cursor: pointer;
}
</style>

</head>

<body>

<h1>🎮 VIKTORIX</h1>

<h2>Create Account</h2>

<input
  id="username"
  type="text"
  placeholder="Username"
  autocomplete="username"
>

<br>

<input
  id="phone"
  type="tel"
  placeholder="9636236300"
  inputmode="numeric"
  autocomplete="tel"
>

<br>

<div id="recaptcha-container"></div>

<br>

<button type="button" id="sendOtpBtn">
  Send OTP
</button>

<br>

<input
  id="otp"
  type="text"
  placeholder="Enter OTP"
  maxlength="6"
  inputmode="numeric"
>

<br>

<button type="button" id="verifyOtpBtn">
  Verify & Create Account
</button>

<br>

<p id="message"></p>

<a href="login.html">Already have account? Login</a>


<script type="module">

import "./auth.js";

document.getElementById("sendOtpBtn").addEventListener(
  "click",
  function () {
    window.sendOTP();
  }
);

document.getElementById("verifyOtpBtn").addEventListener(
  "click",
  function () {
    window.verifyOTP();
  }
);

</script>

</body>
</html>
