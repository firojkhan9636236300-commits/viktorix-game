<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIKTORIX Register</title>

</head>
<body>

<h1>🎮 VIKTORIX</h1>

<h2>Create Account</h2>

<input id="username" type="text" placeholder="Username">

<br><br>

<input id="phone" type="tel" placeholder="+91XXXXXXXXXX">

<br><br>

<div id="recaptcha-container"></div>

<br>

<button onclick="sendOTP()">Send OTP</button>

<br><br>

<input id="otp" type="text" placeholder="Enter OTP" maxlength="6">

<br><br>

<button onclick="verifyOTP()">Verify & Create Account</button>

<br><br>

<p id="message"></p>

<a href="login.html">Already have account? Login</a>

<script type="module" src="auth.js"></script>

</body>
</html>
